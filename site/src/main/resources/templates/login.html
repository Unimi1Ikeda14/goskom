<div th:fragment="content" class="page-centered-container">
    <div class="form-card" style="max-width: 400px;"> 
        <h2 class="form-title">Авторизация</h2>
        
        <div th:if="${error}" class="msg-error text-center">
            ❌ <span th:text="${error}"></span>
        </div>
        
        <div th:if="${successMsg}" class="msg-success text-center">
            ✓ <span th:text="${successMsg}"></span>
        </div>

        <form method="POST" hx-post="/login" hx-target="#main-content">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            
            <div class="form-group">
                <label for="email">Email адрес</label>
                <input type="email" id="email" name="email" class="input-field" required placeholder="example@goskom.by">
            </div>
            
            <div class="form-group" style="margin-bottom: 25px;">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" class="input-field" required placeholder="••••••••">
            </div>
            
            <!-- Кнопка автоматически станет полноэкранной на мобилках из-за базовых стилей админки/форм -->
            <button type="submit" class="btn btn-primary" style="width: 100%;">Войти</button>
        </form>
        
        <p class="text-center" style="margin-top: 20px; font-size: 14px; color: #7f8c8d;">
            Нет аккаунта? <a hx-get="/register" hx-target="#main-content" hx-push-url="/register" style="color: #3498db; cursor: pointer; text-decoration: none; font-weight: bold;">Зарегистрироваться</a>
        </p>
    </div>
</div>
