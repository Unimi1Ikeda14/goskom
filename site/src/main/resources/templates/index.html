<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ГосКом</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>

<body>

    <header class="navbar">
        <div class="logo" 
             hx-get="/welcome" 
             hx-target="#main-content" 
             hx-push-url="/" 
             style="cursor: pointer;">
            🏢 ГосКом
        </div>
        
        <div class="nav-links">
            <div sec:authorize="hasAuthority('ADMIN')">
                <a hx-get="/admin" 
                   hx-target="#main-content" 
                   hx-push-url="/admin" 
                   class="btn-nav-admin">
                    💼 Панель Админа
                </a>
            </div>

            <div sec:authorize="isAuthenticated()" class="user-nav-block">
                <a hx-get="/profile" 
                   hx-target="#main-content" 
                   hx-push-url="/profile" 
                   class="user-nav-block">
                    
                    <img th:if="${currentUser != null && currentUser.avatarPath != null}" 
                         th:src="${currentUser.avatarPath}" 
                         alt="Avatar" 
                         class="avatar-mini">
                    
                    <div th:unless="${currentUser != null && currentUser.avatarPath != null}" 
                         class="avatar-mini-placeholder">
                        👤
                    </div>
                    
                    <span th:text="${currentUser != null ? currentUser.name : 'Жилец'}" class="user-nav-name">Имя</span>
                </a>

                <form th:action="@{/logout}" method="POST" style="display: inline; margin: 0;">
                    <button type="submit" class="btn-nav-logout">Выйти</button>
                </form>
            </div>
            
            <div sec:authorize="isAnonymous()" class="nav-links">
                <a hx-get="/login" hx-target="#main-content" hx-push-url="/login" class="btn-nav-login">Войти</a>
                <a hx-get="/register" hx-target="#main-content" hx-push-url="/register" class="btn-nav-register">Регистрация</a>
            </div>
        </div>
    </header>

    <main id="main-content" class="main-layout">
        <div th:insert="~{__${page ?: 'welcome'}__ :: content}" style="width: 100%;"></div>
    </main>

    <script>
        document.body.addEventListener('htmx:configRequest', (event) => {
            const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
            const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');
            if (csrfToken && csrfHeader) {
                event.detail.headers[csrfHeader] = csrfToken;
            }
        });
    </script>
</body>
</html>
