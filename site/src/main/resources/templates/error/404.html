<div th:fragment="content" style="display: flex; justify-content: center; align-items: center; min-height: 70vh; width: 100%;">
    <div style="text-align: center; max-width: 500px; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%;">
        
        <div style="font-size: 80px; margin-bottom: 20px;">🔍</div>
        
        <h1 style="font-size: 28px; color: #2c3e50; margin: 0 0 10px 0; font-weight: 800;">Ошибка 404</h1>
        <h3 style="font-size: 18px; color: #7f8c8d; margin: 0 0 20px 0; font-weight: 500;">Страница не найдена</h3>
        
        <p style="color: #555; font-size: 15px; line-height: 1.6; margin: 0 0 30px 0;">
            Упс! Запрашиваемый адрес не существует в системе ГосКом или был перенесен.
        </p>

        <a th:href="@{/}" 
        style="display: inline-block; background: #3498db; color: white; text-decoration: none; padding: 12px 30px; font-size: 15px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: background 0.2s;">
            🏠 Вернуться на главную
        </a>
    </div>
</div>
