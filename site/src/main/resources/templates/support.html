<div th:fragment="content" class="support-container">
    
    <div style="margin-bottom: 15px;">
        <button hx-get="/profile" 
                hx-target="#main-content" 
                hx-push-url="/profile" 
                style="background: none; border: none; color: #7f8c8d; font-size: 14px; font-weight: 600; cursor: pointer; padding: 0; display: flex; align-items: center; gap: 5px; transition: color 0.2s;"
                onmouseover="this.style.color='#2c3e50'" 
                onmouseout="this.style.color='#7f8c8d'">
            ⬅️ Назад в профиль
        </button>
    </div>
    
    <div class="support-header">
        <div>
            <h2 style="color: #2c3e50; margin: 0 0 5px 0; font-weight: 800;">🛠️ Центр поддержки жильцов</h2>
            <p style="color: #7f8c8d; margin: 0; font-size: 14px;">История ваших обращений в диспетчерскую службу ГосКом</p>
        </div>
        
        <button hx-get="/support/create" 
                hx-target="#main-content" 
                hx-push-url="/support/create" 
                class="btn btn-create" 
                style="background: #27ae60; color: white; border: none; padding: 10px 20px; font-size: 14px; border-radius: 6px; font-weight: bold; cursor: pointer;">
            ➕ Создать заявку
        </button>
    </div>

    <div th:if="${#lists.isEmpty(tickets)}" 
         style="text-align: center; background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); color: #7f8c8d; font-style: italic;">
        Вы еще не создавали обращений в службу поддержки.
    </div>

    <div th:unless="${#lists.isEmpty(tickets)}" class="tickets-list">
        <div th:each="ticket : ${tickets}" class="ticket-card">
            
            <div>
                <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap;">
                    <span th:text="${ticket.category}" style="background: #ebf5fb; color: #2980b9; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; text-transform: uppercase; white-space: nowrap;">КАТЕГОРИЯ</span>
                    <h4 th:text="${ticket.title}" style="margin: 0; color: #2c3e50; font-size: 16px; font-weight: bold;">Тема обращения</h4>
                </div>
                
                <p th:text="${ticket.description}" class="ticket-desc"></p>
                
                <div style="display: flex; align-items: center; gap: 5px; color: #7f8c8d; font-size: 12px; margin-bottom: 8px; flex-wrap: wrap;">
                    <span>📍 Адрес:</span>
                    <span th:text="${ticket.address != null ? ticket.address : 'Не указан'}" style="font-weight: 600; color: #34495e;"></span>
                </div>

                <small th:text="${#temporals.format(ticket.createdAt, 'dd.MM.yyyy HH:mm')}" style="color: #95a5a6; font-size: 11px; display: block; font-weight: 600;"></small>
            </div>

            <div class="ticket-status-wrapper">
                <span th:text="${ticket.status}" 
                      style="padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: bold; display: inline-block; white-space: nowrap;"
                      th:styleappend="${ticket.status == 'НОВАЯ'} ? 'background: #fef9e7; color: #f39c12;' : (${ticket.status == 'В_РАБОТЕ'} ? 'background: #e8f8f5; color: #16a085;' : 'background: #eaeded; color: #7f8c8d;')">
                    СТАТУС
                </span>
            </div>
            
        </div>
    </div>
</div>
