<div th:fragment="content" class="page-centered-container">
    <div class="form-card" style="max-width: 400px;">
        
        <h2 class="form-title">Регистрация</h2>
        
        <div th:if="${error}" class="msg-error text-center">
            ❌ <span th:text="${error}"></span>
        </div>

        <form hx-post="/register" hx-target="#main-content" hx-swap="innerHTML" th:object="${userDto}">
            
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            
            <div class="form-group">
                <label>ФИО</label>
                <input type="text" th:field="*{name}" class="input-field" required />
                <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="msg-error-text"></p>
            </div>
            
            <div class="form-group">
                <label>Email адрес</label>
                <input type="email" th:field="*{email}" class="input-field" required />
                <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="msg-error-text"></p>
            </div>
            
            <div class="form-group" style="margin-bottom: 25px;">
                <label>Пароль</label>
                <input type="password" th:field="*{password}" class="input-field" required />
                <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="msg-error-text"></p>
            </div>
            
            <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
            
        </form>
        
        <p class="text-center" style="margin-top: 20px; font-size: 14px; color: #7f8c8d;">
            Уже есть аккаунт? <a hx-get="/login" hx-target="#main-content" hx-push-url="/login" style="color: #3498db; cursor: pointer; text-decoration: none; font-weight: bold;">Войти</a>
        </p>
    </div>
</div>
